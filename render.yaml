databases:
  - name: reconflow-postgres
    databaseName: reconflow
    user: reconflow
    plan: 0.1c-256mb

services:
  - type: web
    name: reconflow-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    disk:
      name: reconflow-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reconflow-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
